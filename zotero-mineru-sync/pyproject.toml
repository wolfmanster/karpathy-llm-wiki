[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zotero-mineru-sync"
version = "0.1.0"
description = "Local event-triggered Zotero to MinerU synchronization"
requires-python = ">=3.10"

[project.scripts]
zotero-mineru-sync = "zotero_mineru_sync.cli:main"
zotero-mineru-sync-build-plugin = "build_plugin:main"

[tool.setuptools]
py-modules = ["build_plugin"]

[tool.setuptools.packages.find]
include = ["zotero_mineru_sync*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
