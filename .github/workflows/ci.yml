name: Zotero-MinerU Sync CI

on:
  push:
    paths:
      - "zotero-mineru-sync/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "zotero-mineru-sync/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python and plugin tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: zotero-mineru-sync

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: zotero-mineru-sync/pyproject.toml

      - name: Install Python test dependency
        run: python -m pip install --upgrade pip pytest

      - name: Run Python tests
        run: python -m pytest tests/test_sync.py -q

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run plugin tests
        run: node --test tests/test_plugin.mjs tests/test_runtime.mjs

      - name: Build Zotero plugin
        run: python build_plugin.py --output .testdata/zotero-mineru-sync.xpi

      - name: Upload plugin package
        uses: actions/upload-artifact@v4
        with:
          name: zotero-mineru-sync.xpi
          path: zotero-mineru-sync/.testdata/zotero-mineru-sync.xpi
          if-no-files-found: error
